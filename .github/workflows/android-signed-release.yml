name: Build DarkShield signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkshield-signed-release
  cancel-in-progress: true

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      DARKSHIELD_KEYSTORE_PATH: ${{ github.workspace }}/.darkshield-release.keystore
      DARKSHIELD_KEYSTORE_PASSWORD: ${{ secrets.DARKSHIELD_KEYSTORE_PASSWORD }}
      DARKSHIELD_KEY_ALIAS: ${{ secrets.DARKSHIELD_KEY_ALIAS }}
      DARKSHIELD_KEY_PASSWORD: ${{ secrets.DARKSHIELD_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Validate signing configuration
        env:
          DARKSHIELD_KEYSTORE_BASE64: ${{ secrets.DARKSHIELD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DARKSHIELD_KEYSTORE_BASE64" || { echo "::error::Missing DARKSHIELD_KEYSTORE_BASE64"; exit 1; }
          test -n "$DARKSHIELD_KEYSTORE_PASSWORD" || { echo "::error::Missing DARKSHIELD_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DARKSHIELD_KEY_ALIAS" || { echo "::error::Missing DARKSHIELD_KEY_ALIAS"; exit 1; }
          test -n "$DARKSHIELD_KEY_PASSWORD" || { echo "::error::Missing DARKSHIELD_KEY_PASSWORD"; exit 1; }
          printf '%s' "$DARKSHIELD_KEYSTORE_BASE64" | base64 --decode > "$DARKSHIELD_KEYSTORE_PATH"
          chmod 600 "$DARKSHIELD_KEYSTORE_PATH"
          test -s "$DARKSHIELD_KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleRelease
          fi

      - name: Verify signed APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*-release*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload signed release
        uses: actions/upload-artifact@v6
        with:
          name: DarkShield-signed-release
          path: |
            DarkShield/app/build/outputs/**/*.apk
            DarkShield/app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
