name: Build DarkShield APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DarkShield/**"
      - ".github/workflows/android-apk.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: darkshield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate Android project
        working-directory: DarkShield
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        id: build_apk
        working-directory: DarkShield
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests when present
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if find app/src/test -type f \( -name '*.java' -o -name '*.kt' \) 2>/dev/null | grep -q .; then
            ./gradlew --no-daemon test
          else
            echo "No unit tests yet; build validation continues."
          fi

      - name: Validate optimized release build
        if: ${{ always() && steps.build_apk.outcome == 'success' }}
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi
          RELEASE_APK="$(find app/build/outputs -type f -name '*-release*.apk' | head -n 1)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          ls -lh "$RELEASE_APK"

      - name: Run Android lint
        if: ${{ always() && steps.build_apk.outcome == 'success' }}
        working-directory: DarkShield
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug

      - name: Locate and verify APK
        if: ${{ always() && steps.build_apk.outcome == 'success' }}
        working-directory: DarkShield
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          BUILD_TOOLS="$(dirname "$APKSIGNER")"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DarkShield-debug-apk
          path: |
            DarkShield/app/build/outputs/**/*.apk
            DarkShield/app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
