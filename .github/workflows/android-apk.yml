name: Build DarkShield APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DarkShield/**"
      - ".github/workflows/android-apk.yml"
      - "DarkShield_backup_v0.6.0.zip"

permissions:
  contents: read

concurrency:
  group: darkshield-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Validate Android project
        working-directory: DarkShield
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Run unit tests when present
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if find app/src/test -type f \( -name '*.java' -o -name '*.kt' \) 2>/dev/null | grep -q .; then
            if [ -x "./gradlew" ]; then
              ./gradlew --no-daemon test
            else
              gradle --no-daemon test
            fi
          else
            echo "No unit tests yet; build validation continues."
          fi

      - name: Run Android lint
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon lintDebug
          else
            gradle --no-daemon lintDebug
          fi

      - name: Locate and verify APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: DarkShield-debug-apk
          path: |
            DarkShield/app/build/outputs/**/*.apk
            DarkShield/app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
