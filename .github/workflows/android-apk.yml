name: Build DarkShield APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DarkShield_backup_v0.6.0.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate backup
        run: |
          set -euo pipefail
          test -s DarkShield_backup_v0.6.0.zip
          unzip -t DarkShield_backup_v0.6.0.zip

      - name: Extract Android project
        run: |
          set -euo pipefail
          rm -rf build-project
          mkdir build-project
          unzip -q DarkShield_backup_v0.6.0.zip -d build-project

          PROJECT_DIR="$(find build-project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -n 100

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Locate and verify APK
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkShield-debug-apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
