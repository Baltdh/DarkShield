name: Build DarkShield release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkshield-release-candidate
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build unsigned release APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Validate release APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*-release*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "Release candidate is intentionally unsigned; sign it with the distribution keystore before publishing."
          ls -lh "$APK" "$APK.sha256"

      - name: Upload release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DarkShield-release-candidate
          path: |
            DarkShield/app/build/outputs/**/*.apk
            DarkShield/app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
