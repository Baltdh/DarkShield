name: Build DarkShield release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkshield-release-candidate
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build unsigned release APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleRelease
          fi

      - name: Validate release APK
        working-directory: DarkShield
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*-release*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "Release candidate is intentionally unsigned; sign it with the distribution keystore before publishing."
          ls -lh "$APK" "$APK.sha256"

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: DarkShield-release-candidate
          path: |
            DarkShield/app/build/outputs/**/*.apk
            DarkShield/app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
