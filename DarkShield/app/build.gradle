plugins { id 'com.android.application' }

def releaseSigningValues = [
    System.getenv('DARKSHIELD_KEYSTORE_PATH'),
    System.getenv('DARKSHIELD_KEYSTORE_PASSWORD'),
    System.getenv('DARKSHIELD_KEY_ALIAS'),
    System.getenv('DARKSHIELD_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigningValues.every { it != null && !it.isEmpty() }

android {
    namespace 'com.darkshield.security'
    compileSdk 35
    defaultConfig {
        applicationId 'com.darkshield.security'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('DARKSHIELD_KEYSTORE_PATH'))
                storePassword System.getenv('DARKSHIELD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DARKSHIELD_KEY_ALIAS')
                keyPassword System.getenv('DARKSHIELD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
